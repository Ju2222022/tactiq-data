name: Build TactIQ Eleven Database

on:
  schedule:
    # Exécution le 1er de chaque mois à minuit
    - cron: '0 0 1 * *'
    
  # Permet de lancer le script manuellement depuis l'interface GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install pandas kagglehub
        
      - name: Run Python Builder
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_TACTIQ_KEY: ${{ secrets.KAGGLE_TAACTIQ_KEY }}
        run: python build_tactiq_db.py
        
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add players.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update football players database" && git push)
